<!-- v19.0: FINE GRID — new step value 'f' (mult 1/48 quarter = 1/48 beat): straight 16ths (12 steps), triplet 16ths (8), 32nds (6) and 64ths (3) all land on integer steps in one file, so no rhythm stretching is needed. MIDI ticks per step = 480/48 = 10 exactly. Step/meter caps raised 64 -> 512 (a 4/4 bar at the fine grid is 192 steps). READOUT FIX (G1) — the sequencer info line now shows the main meter steps (mode over the first 64 bars of the meter map) instead of bar 0's length, so a pickup-first file no longer reads as its pickup bar. Playback bar-boundary logic unchanged. RENDER FIX — oscillator cards for patterns over 2048 steps render a summary instead of one DOM button per step (grid/dur/prob/accent/lock/melody editors), which made the 27,456-step Bach patterns unrenderable (import timed out at 30s before the fix); playback, score and MIDI paths are untouched, and patterns up to 2048 steps render exactly as before. Sibling of v18; no other files changed. -->
<!-- v18.0: METER CHANGES — sequencer.meterChanges, a bar-sorted timeline of {bar, num, den, steps}; bar boundaries in live playback, SCORE playback/render and chain timing now come from the meter map (meterStepsAtBar / meterStepForBar / meterBarForAbsStep) instead of bar*stepCount. Patterns stay step-indexed: only bar boundaries move. SCORE MIDI EXPORT — exportScoreMIDI() bounces the score arrangement to SMF Type 1 (one pass, tempo + time-signature metas, fades as velocity, mutes/solos honoured); patch exportMIDI() now also emits time-signature metas and no longer needs to refuse score mode, since score export is its own function. Sibling of v17.12.6; no other files changed. -->

<!-- v17.10 GAIN CHAIN (2026-10-13): master is now voice trim > patch trim (per patch, dB) > drive > soft-clip > ceiling > brickwall limiter; stings join at the limiter; pre-clip/out/limiter-GR meters; offline measure + auto-trim per patch toward a target RMS (through the soft-clip); bridge-owned layers (fragment/monster voices) get their own dB trim; window.CALORIS_GAIN API + buildPanel(doc,host) so a host game can mount the same knobs. All defaults neutral (0 dB). -->
<!-- v17.3 SCORE END MARKER — optional end flag on the ruler (drag to move, tap its bar number to set/clear, tap the flag to return to auto). Sets where the loop wraps, where playback stops when loop is off, and how long the Score WAV/MP3 render runs; clips past it are shaded and don't sound. No marker = auto (end of last clip), as before. +clip now appends right after the last clip. -->
<!-- v17.2 SCORE LOOP — loop toggle (wraps playback to bar 1 at the end of the last clip, live and saved in the score), rewind button (scroll to bar 1, restarts if playing), follow toggle (timeline pages along with the playhead and snaps back to the start on loop). -->
<!-- v17.1 SCORE EDITING — tap an empty lane spot to add a clip there (trimmed to fit a gap), drag a clip to move it (bar-snapped, touch-safe via pointer events), drag the right-edge grip to resize, ISO button per track (isolate = silence every other track; several can be isolated together; honored by Score WAV/MP3 render), gaps/silent stretches are first-class (empty lane = silence), timeline keeps scroll position across edits, sticky track headers, larger touch targets. -->
<!-- v16.1 (2026-10-12): hzToNote named every pitch 3 semitones too high (A440 -> C4) because its index counted from A but NOTE_NAMES starts at C; fixed (affects scale-arp root, MIDI note for plain-frequency voices, in-scale hints, labels). ARP POOL — per-oscillator arpPool 'all'|'bar' (UI select next to the arp mode); 'bar' arps only the gated melody notes of the bar being played, in live, WAV render and MIDI export, and is a Score pattern key. SUSTAIN 0 — sustain||.8 -> sustain??.8 in live and offline gain paths, so sustain 0 (pluck) really decays to silence. -->
<!-- v16.0+scorexp (2026-10-12, Juno): SCORE EXPORT — WAV/MP3 render source toggle (Patch/Score); renderScoreToWAV bounces the arrangement via a per-step scoreHook in renderToWAV (clip pattern swaps, fades, drop-outs, per-voice drum routing). Also: drum/sample one-shots now disconnect on end (was leaking ~8 nodes/hit forever, slowing long renders); volume fallbacks || -> ?? so 0 truly silences. -->
<!-- v16.0+vis2 (2026-10-12, Juno): VIS — fullscreen off-button + preset switcher (auto-hide on mouse idle), 4 new presets: Nebula, Spiral, Cascade, Kaleidoscope (10 total). -->
<!-- v16 (2026-10-12, Juno): SCORE — DAW-close arrangement. Tracks are instruments (timbre), clips are oscillator-loops (pattern); rows play simultaneously. Clips may overlap (topmost wins per track) and carry fadeIn/fadeOut in bars. Playback reuses seqTick via a virtual '__score' patch; VIS visualizers use track colors. -->
<!-- v15.23.1+vis (2026-10-12, Juno): composition-driven performance visualizers (VIS) — off/overlay/fullscreen three-way toggle, 6-preset registry, hooks in seqTick/playSting. -->
<!-- v15.23 (2026-10-10): resonator DSP pass. Ring time is pitch-independent (feedback = per-period gain at 220 Hz scaled by 220/f, with the loop lowpass loss divided back out), DC blocker in the loop (phase lead compensated),

<!-- v15.22 (2026-10-10): resonator runs on an inline AudioWorklet (true single-period Karplus-Strong loop at any pitch) with automatic delay-loop fallback. -->

//   type 'string'   one loop tuned to the note

//   type 'membrane' four loops tuned to circular-membrane mode ratios (inharmonic)

// cannot be shorter than ~2.9 ms (about 345 Hz at 44.1 kHz). Above that the loop is n periods long (n/f) and its
// per-trip gain is feedback^n, which keeps ring time per period the same and still reinforces every harmonic of f.

function encodeWAV(buffer){

const EXPORT_ROOT_LS='caloris_export_root';

function encodeMP3(buffer){
  const nCh=buffer.numberOfChannels,sr=buffer.sampleRate;
  const mp3encoder=new lamejs.Mp3Encoder(nCh,sr,320);
  const left=buffer.getChannelData(0),right=nCh>1?buffer.getChannelData(1):left;

  const ir=octx.createBuffer(2,rLen,sr);
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch);for(let i=0;i<rLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rLen,revDec);}
  const oConv=octx.createConvolver();oConv.buffer=ir;
  const oRevIn=octx.createGain(),oRevOut=octx.createGain();oRevOut.gain.value=RS.reverbWetMaster||.7;
  oRevIn.connect(oConv);oConv.connect(oRevOut);oRevOut.connect(oMaster);

  const cfg=RS.configs[RS.currentType];
  if(cfg.oscillators.some(o=>o&&o.resonance&&o.resonance.enabled!==false))await ensureKSWorklet(octx);
  // Offline drum bus
  const oDrumBus=octx.createGain();oDrumBus.gain.value=(RS.drumVol!=null?RS.drumVol:0.8);
  const oDrumShape=octx.createWaveShaper();oDrumShape.curve=makeDistCurve(40,'soft');oDrumShape.oversample='4x';
  oDrumBus.connect(oDrumShape);oDrumShape.connect(oMaster);

  const isKitPatch=cfg.type==='kit';
  // Live routing: only kit patches go through the drum bus; everything else straight to master.
  const voiceDest=isKitPatch?oDrumBus:oMaster;
  // Score render: optional per-step hook (voice, voiceIdx, bar, step) mirroring
  // SCORE.onStep — swaps clip patterns and sets fade/mute volume on the offline
  // voice copies. Returns true when the pattern changed (scheduler refreshes).
  const scoreHook=(renderCtx&&renderCtx.scoreHook)||null;

  cfg.oscillators.forEach((oscCfg,oi)=>{
    if(!oscCfg||oscCfg.muted)return;
    const isNoise=NOISE_WAVES.has(oscCfg.wave);
    const isDrumVoice=DRUM_WAVES.has(oscCfg.wave);
    // Score mode: route drum voices through the drum bus per voice — the score's
    // virtual patch mixes kits and synths, exactly like live SCORE.play().
    const vdest=scoreHook?(isDrumVoice?oDrumBus:oMaster):voiceDest;
    // Same phase rule as seqTick: floor(absoluteStep * rateMult) % loopLength, where the
    // absolute step runs on across bars (it never restarts with the bar).
    // Score mode refreshes these whenever the hook swaps the clip pattern.
    let stepsV,oscStepAt,steps,sd,arpStep;
    const refreshPat=()=>{
      stepsV=resizeSteps(oscCfg.steps,oscCfg.steps&&oscCfg.steps.length?oscCfg.steps.length:RS.stepCount);
      oscStepAt=abs=>Math.floor(abs*(oscCfg.rateMult||1))%stepsV.length;
      steps=stepsV;sd=oscCfg.stepData;
      arpStep=(oscCfg.arpEnabled&&!isNoise)?makeArpStepper(oscCfg,RS.stepCount):null;
    };
    refreshPat();
    const scoreStep=(bar,step)=>{if(scoreHook&&scoreHook(oscCfg,oi,bar,step))refreshPat();};

    // DRUM PATH — schedule one-shot per active step
    if(isDrumVoice){
      for(let bar=0;bar<bars;bar++){
        for(let step=0;step<barSteps[bar];step++){
          scoreStep(bar,step);
          const absStep=barStepOff[bar]+step;
          const t=barStartSec[bar]+step*beatSec+(step%2===1?RS.swing/1000:0);
          const oscStep=oscStepAt(absStep);
          let vel=0,pitchOffset=0,decayMult=1,effVel=0;
          if((isKitPatch||scoreHook)&&sd&&sd.length){
            const entry=sd[oscStep%sd.length];
            if(entry&&entry.on){vel=entry.vel??1;pitchOffset=entry.pitch??0;decayMult=entry.decay??1;}
            effVel=vel;
          } else {
            vel=stepsV[oscStep]||0;
            const prob=(oscCfg.stepProbs&&oscCfg.stepProbs.length>oscStep)?(oscCfg.stepProbs[oscStep]??100):100;
            effVel=(vel>0&&prob<100&&Math.random()*100>=prob)?0:vel;
          }
          const accentD=(oscCfg.stepAccents&&oscCfg.stepAccents.length>oscStep)?(oscCfg.stepAccents[oscStep]??1):1;effVel*=accentD;
          if(effVel>0)_scheduleDrum(octx,oscCfg,effVel,t,pitchOffset,decayMult,vdest,oRevIn);
        }
      }
      return;
    }

    // SAMPLE PATH — schedule one-shots through offline context
    if(oscCfg.wave==='sample'){
      if(!oscCfg.sampleBuffer||typeof oscCfg.sampleBuffer.getChannelData!=='function')return;
      const sBus=octx.createGain();sBus.gain.value=scoreHook?1:(oscCfg.volume??0.04);
      const pan=octx.createStereoPanner?octx.createStereoPanner():octx.createGain();
      if(pan.pan)pan.pan.value=oscCfg.pan||0;
      sBus.connect(pan);pan.connect(vdest);
      if((oscCfg.reverbSend||0)>0){const rs=octx.createGain();rs.gain.value=oscCfg.reverbSend;pan.connect(rs);rs.connect(oRevIn);}
      const rawBuf=oscCfg.sampleBuffer;
      const oBuf=octx.createBuffer(rawBuf.numberOfChannels,rawBuf.length,rawBuf.sampleRate);
      for(let ch=0;ch<rawBuf.numberOfChannels;ch++)oBuf.getChannelData(ch).set(rawBuf.getChannelData(ch));
      for(let bar=0;bar<bars;bar++){
        for(let step=0;step<barSteps[bar];step++){
          scoreStep(bar,step);
          const t=barStartSec[bar]+step*beatSec+(step%2===1?RS.swing/1000:0);
          const oscStep=oscStepAt(barStepOff[bar]+step);
          const vel=steps[oscStep]||0;
          const prob=(oscCfg.stepProbs&&oscCfg.stepProbs.length>oscStep)?(oscCfg.stepProbs[oscStep]??100):100;
          let effVel=(vel>0&&prob<100&&Math.random()*100>=prob)?0:vel;
          const accentS=(oscCfg.stepAccents&&oscCfg.stepAccents.length>oscStep)?(oscCfg.stepAccents[oscStep]??1):1;effVel*=accentS;
          if(!effVel)continue;
          const src=octx.createBufferSource();src.buffer=oBuf;
          const vg=octx.createGain();vg.gain.value=effVel*(scoreHook?(oscCfg.volume??0.04):1);
          src.connect(vg);vg.connect(sBus);
          src.start(t);src.stop(t+oBuf.duration);
          src.onended=()=>{try{vg.disconnect();}catch(e){}};
        }
      }
      return;
    }

    const isPartial=!isNoise&&oscCfg.wave==='custom'&&hasNonIntegerRatios(oscCfg);
    const uniN=Math.max(1,Math.min(8,oscCfg.unisonCount||1));
    const unisonMix=octx.createGain();unisonMix.gain.value=isPartial?1:(1/Math.sqrt(uniN));
    const mainGain=octx.createGain();mainGain.gain.value=0;

    // Source. offlineOscs holds every pitched source as {param,ratio} so note changes,
    // glide, pitch LFOs and FM reach unison voices and inharmonic partial banks alike.
    const offlineOscs=[];
    if(isNoise){
      const buf=makeNoiseBuffer(sr,oscCfg.wave),oBuf=octx.createBuffer(1,buf.length,sr);
      oBuf.getChannelData(0).set(buf);
      const src=octx.createBufferSource();src.buffer=oBuf;src.loop=true;src.connect(unisonMix);src.start(0);
    } else if(isPartial){
      buildPartialBank(octx,oscCfg,unisonMix).forEach(b=>{if(b.osc.frequency)offlineOscs.push({param:b.osc.frequency,ratio:b.ratio||1});});
    } else {
      const spread=uniN>1?(oscCfg.unisonDetune||20):0;
      for(let i=0;i<uniN;i++){
        const o=octx.createOscillator(),det=uniN>1?spread*(i/(uniN-1)-.5):0;
        setOscWave(o,oscCfg.wave,octx,oscCfg.harmonics,oscCfg.harmonicPhases);
        o.frequency.value=oscCfg.freq;o.detune.value=det;o.connect(unisonMix);o.start(0);
        offlineOscs.push({param:o.frequency,ratio:1});
      }
    }

    // LFO 1 + LFO 2 (routing mirrors createGroup)
    const lt=oscCfg.lfoTarget||'pitch',lt2=oscCfg.lfo2Target||'pitch';
    const lfo=octx.createOscillator(),lfoG=octx.createGain(),lfo2=octx.createOscillator(),lfo2G=octx.createGain();
    lfo.type='sine';lfo.frequency.value=oscCfg.lfoRate||.1;
    lfo2.type='sine';lfo2.frequency.value=oscCfg.lfo2Rate||.3;
    lfoG.gain.value=lt==='volume'?(oscCfg.lfoDepth||0)*.5:(oscCfg.lfoDepth||0);
    lfo2G.gain.value=lt2==='volume'?(oscCfg.lfo2Depth||0)*.5:(oscCfg.lfo2Depth||0);
    lfo.connect(lfoG);lfo2.connect(lfo2G);

    const resN=(oscCfg.resonance&&oscCfg.resonance.enabled!==false)?createResonator(octx,normalizeResonance(oscCfg.resonance),oscCfg.freq):null;
    const trimGain=octx.createGain();trimGain.gain.value=Math.pow(10,Math.max(-24,Math.min(12,oscCfg.gainTrim||0))/20);
    const tremoloGain=octx.createGain();tremoloGain.gain.value=1;
    let filt=null; // hoisted so per-step locks can automate it
    if(oscCfg.filterEnabled){filt=octx.createBiquadFilter();filt.type=oscCfg.filterType||'lowpass';filt.frequency.value=oscCfg.filterFreq||800;filt.Q.value=oscCfg.filterQ||1;}
    const panNode=octx.createStereoPanner?octx.createStereoPanner():octx.createGain();if(panNode.pan)panNode.pan.value=oscCfg.pan||0;

    const routeLfo=(g,target,allowPan)=>{
      if(target==='volume')g.connect(tremoloGain.gain);
      else if(target==='filter'){if(filt)g.connect(filt.frequency);}
      else if(allowPan&&target==='pan'){if(panNode.pan)g.connect(panNode.pan);}
      else if(!isNoise)offlineOscs.forEach(o=>g.connect(o.param));
    };
    routeLfo(lfoG,lt,false);routeLfo(lfo2G,lt2,true);
    lfo.start(0);lfo2.start(0);

    // FM operator
    let fmNode=null;
    if(!isNoise&&!isPartial&&oscCfg.fmEnabled&&(oscCfg.fmDepth||0)>0){
      fmNode=octx.createOscillator();const fmG=octx.createGain();
      fmNode.type='sine';fmNode.frequency.value=oscCfg.freq*(oscCfg.fmRatio||2);fmG.gain.value=oscCfg.fmDepth;
      fmNode.connect(fmG);offlineOscs.forEach(o=>fmG.connect(o.param));fmNode.start(0);
    }

    // Chain: unison -> ADSR gain -> trim -> tremolo -> filter -> chorus -> distortion -> pan
    unisonMix.connect(mainGain);mainGain.connect(trimGain);trimGain.connect(tremoloGain);
    let chainOut=tremoloGain;
    if(resN){chainOut.connect(resN.inp);chainOut=resN.out;}
    if(filt){chainOut.connect(filt);chainOut=filt;}
    if(oscCfg.chorusEnabled){const cn=createChorusNodes(octx,oscCfg);chainOut.connect(cn.inp);chainOut=cn.out;}
    if(oscCfg.distEnabled){const dn=createDistNodes(octx,oscCfg);chainOut.connect(dn.inp);chainOut=dn.out;}
    chainOut.connect(panNode);

    const dw=Math.max(0,Math.min(1,oscCfg.delayWet||0));
    const dryG=octx.createGain();dryG.gain.value=Math.sqrt(1-dw);panNode.connect(dryG);dryG.connect(vdest);
    if(dw>0){
      const del=octx.createDelay(10),delFb=octx.createGain(),delWet=octx.createGain();
      del.delayTime.value=oscCfg.delayTime||0;delFb.gain.value=oscCfg.delayFeedback||0;delWet.gain.value=Math.sqrt(dw);
      panNode.connect(del);del.connect(delFb);delFb.connect(del);del.connect(delWet);delWet.connect(vdest);
    }
    if((oscCfg.reverbSend||0)>0){const rs=octx.createGain();rs.gain.value=oscCfg.reverbSend;panNode.connect(rs);rs.connect(oRevIn);}

  // Schedule sequencer events
let prevV=0;
let lastHz=oscCfg.freq,lastSounded=false; // glide tracking
const glideSecR=isNoise?0:(oscCfg.glide||0);
for(let bar=0;bar<bars;bar++){
  for(let step=0;step<barSteps[bar];step++){
    scoreStep(bar,step);
    const t=barStartSec[bar]+step*beatSec+(step%2===1?RS.swing/1000:0);
    const oscStep=oscStepAt(barStepOff[bar]+step);
    const vel=steps[oscStep]||0;
    const prob=(oscCfg.stepProbs&&oscCfg.stepProbs.length>oscStep)?(oscCfg.stepProbs[oscStep]??100):100;
    let effVel=(vel>0&&prob<100&&Math.random()*100>=prob)?0:vel;

    // v15.19: hoist locks above the note-selection branch so the sub-step
    // arp path below can read pitch locks. Logic identical to before.
    const hasLocks=oscCfg.stepLocks&&Object.keys(oscCfg.stepLocks).length>0;
    const locks=hasLocks?(oscCfg.stepLocks[oscStep]||null):null;
    if(hasLocks){
      if(filt){filt.frequency.setValueAtTime((locks&&locks.filterFreq!=null)?locks.filterFreq:(oscCfg.filterFreq||800),t);filt.Q.setValueAtTime((locks&&locks.filterQ!=null)?locks.filterQ:(oscCfg.filterQ||1),t);}
      if(panNode.pan)panNode.pan.setValueAtTime((locks&&locks.pan!=null)?locks.pan:(oscCfg.pan||0),t);
    }

    // v15.19: sub-step arp — arpRate > 1 emits N notes per step, each
    // advancing the sequence cursor and owning its own ADSR envelope.
    // Rate ≤ 1 falls through to the single-note path below.
    if(arpStep&&effVel>0){
      arpStep.at(oscStep);
      const arpRateEff=Math.max(0.25,Math.min(4,oscCfg.arpRate||1));
      if(arpRateEff>1){
        const subCount=Math.round(arpRateEff);
        const subDurSec=beatSec/subCount;
        const subGateSec=subDurSec*Math.max(0.02,Math.min(1,oscCfg.arpGate||0.5));
        const accentEarly=(oscCfg.stepAccents&&oscCfg.stepAccents.length>oscStep)?(oscCfg.stepAccents[oscStep]??1):1;
        const subVel=effVel*accentEarly;
        const subVol=subVel*(oscCfg.volume??.04);
        const pitchLock=(locks&&locks.pitch)?locks.pitch:0;
        const pitchMult=Math.pow(2,pitchLock/12);
        // v15.19: within-step sub-notes glide, capped at 80% of the sub-step.
        // Seeded from lastHz/lastSounded so the first sub-note glides in from
        // the previous step's final pitch (or jumps, if that step was a rest).
        let lastSubHz=lastHz;
        let subSounded=lastSounded;
        const subGlideSecR=Math.min(glideSecR, subDurSec*0.8);
        for(let k=0;k<subCount;k++){
          const subT=t+k*subDurSec;
          const hz=arpStep.nextNote();
          const finalHz=hz*pitchMult;
          const doGlide=subGlideSecR>0.001&&subSounded&&Math.abs(lastSubHz-finalHz)>0.05;
          offlineOscs.forEach(o=>{
            const from=lastSubHz*o.ratio,to=finalHz*o.ratio;
            o.param.cancelScheduledValues(subT); // v17.9: drop tail of any earlier step's glide ramp
            if(doGlide){
              o.param.setValueAtTime(Math.max(1,from),subT);
              o.param.exponentialRampToValueAtTime(Math.max(1,to),subT+subGlideSecR);
            }else{
              o.param.setValueAtTime(Math.max(1,to),subT);
            }
          });
          if(fmNode){
            const r=oscCfg.fmRatio||2;
            const from=lastSubHz*r,to=finalHz*r;
            fmNode.frequency.cancelScheduledValues(subT);
            if(doGlide){
              fmNode.frequency.setValueAtTime(Math.max(1,from),subT);
              fmNode.frequency.exponentialRampToValueAtTime(Math.max(1,to),subT+subGlideSecR);
            }else{
              fmNode.frequency.setValueAtTime(Math.max(1,to),subT);
            }
          }
          if(resN&&resN.rc.trackPitch!==false)resN.setFreq(finalHz,subT,doGlide?subGlideSecR:0);
          mainGain.gain.setValueAtTime(0,subT);
          mainGain.gain.linearRampToValueAtTime(subVol,subT+Math.max(.002,oscCfg.attack||.005));
          const decT=subT+Math.max(.002,oscCfg.attack||.005)+Math.max(.002,oscCfg.decay||.1);
          mainGain.gain.linearRampToValueAtTime(subVol*(oscCfg.sustain??.8),decT);
          const gateT=Math.max(subT+.01,subT+subGateSec-.05);
          mainGain.gain.setValueAtTime(subVol*(oscCfg.sustain??.8),gateT);
          mainGain.gain.linearRampToValueAtTime(0,gateT+Math.max(.002,oscCfg.release||.15));
          lastSubHz=finalHz;
          subSounded=true;
        }
        lastHz=lastSubHz;lastSounded=true;
        prevV=subVel;
        continue;
      }
    }

    // ── single-note path (rate ≤ 1, or non-arp) — unchanged from here ──
    // Note selection: arp > melody > base pitch (same precedence as seqTick)
    let noteHz=null,melVel=1,arpGateSec=null;
    if(arpStep&&effVel>0){noteHz=arpStep(step);arpGateSec=beatSec*Math.max(0.02,Math.min(1,oscCfg.arpGate||0.5));}
    else if(oscCfg.melody&&oscCfg.melody.length&&effVel>0){
      const slot=oscCfg.melody[oscStep%oscCfg.melody.length];
      if(slot&&(slot.prob===undefined||Math.random()*100<slot.prob)){
        if(slot.vel!==undefined)melVel=slot.vel;
        if(!isNoise||resN)noteHz=noteToHz(slot.note,slot.octave);
      }
    } else if((!isNoise||resN)&&effVel>0)noteHz=oscCfg.freq;
    effVel*=melVel;
    const accent=(oscCfg.stepAccents&&oscCfg.stepAccents.length>oscStep)?(oscCfg.stepAccents[oscStep]??1):1;effVel*=accent;
    const vol=effVel*(oscCfg.volume??.04);

    if(effVel>0&&noteHz!=null){
      let finalHz=noteHz;
      if(locks&&locks.pitch&&!isNoise)finalHz*=Math.pow(2,locks.pitch/12);
      const doGlide=glideSecR>0.001&&lastSounded&&Math.abs(lastHz-finalHz)>0.05;
      const setF=(param,tgt,from)=>{
        if(doGlide){param.cancelScheduledValues(t);param.setValueAtTime(Math.max(1,from),t);param.exponentialRampToValueAtTime(Math.max(1,tgt),t+glideSecR);}
        else{param.cancelScheduledValues(t);param.setValueAtTime(Math.max(1,tgt),t);} // v17.9: mirror live applyNoteFreq
      };
      offlineOscs.forEach(o=>setF(o.param,finalHz*o.ratio,lastHz*o.ratio));
      if(fmNode){const r=oscCfg.fmRatio||2;setF(fmNode.frequency,finalHz*r,lastHz*r);}
      if(resN&&resN.rc.trackPitch!==false)resN.setFreq(finalHz,t,doGlide?glideSecR:0);
      lastHz=finalHz;lastSounded=true;
    } else if(effVel<=0)lastSounded=false; // rests break the glide chain

    if(effVel>0&&prevV===0){
      mainGain.gain.setValueAtTime(0,t);
      mainGain.gain.linearRampToValueAtTime(vol,t+Math.max(.002,oscCfg.attack||.005));
      const decT=t+Math.max(.002,oscCfg.attack||.005)+Math.max(.002,oscCfg.decay||.1);
      mainGain.gain.linearRampToValueAtTime(vol*(oscCfg.sustain??.8),decT);
      const sdm=(oscCfg.stepDurs&&oscCfg.stepDurs.length>oscStep)?(oscCfg.stepDurs[oscStep]||1):1;
      const gateLen=arpGateSec!=null?arpGateSec:beatSec*sdm*(oscCfg.gateTime||1);
      const gateT=Math.max(t+.01,t+gateLen-.05);
      mainGain.gain.setValueAtTime(vol*(oscCfg.sustain??.8),gateT);
      mainGain.gain.linearRampToValueAtTime(0,gateT+Math.max(.002,oscCfg.release||.15));
    } else if(effVel===0&&prevV>0){
      mainGain.gain.linearRampToValueAtTime(0,t+Math.max(.002,oscCfg.release||.15));
    } else if(effVel>0&&prevV>0){
      mainGain.gain.setValueAtTime(vol*(oscCfg.sustain??.8),t);
    }
    prevV=effVel;
    }
   }
  });

  if(onProgress)onProgress(0.1);
  const rendered=await octx.startRendering();
  if(onProgress)onProgress(1);
  return rendered;
}

// ── SCORE RENDER ── offline bounce of the arrangement in S.score ──────────
// Builds the same virtual voices as SCORE.play() (timbre + active clip pattern
// per track) without touching live state, then renders through renderToWAV
// with a per-step hook that mirrors SCORE.onStep: clip-boundary pattern swaps
// plus fade-in/out and mute volume scaling. Drop-out bars render as silence.
async function renderScoreToWAV(onProgress){
  if(window.SCORE&&typeof SCORE.sanitize==='function')SCORE.sanitize();
  const tracks=(S.score&&S.score.tracks)||[];
  if(!tracks.length)throw new Error('Score is empty — add a track first');
  const PAT=['steps','stepData','stepDurs','stepProbs','stepAccents','stepLocks',
    'melody','melodyOctave','gateTime','rateMult','freq',
    'arpEnabled','arpMode','arpPool','arpOctaves','arpRate','arpGate'];
  const dc=o=>{
    if(o===null||typeof o!=='object')return o;
    if(Array.isArray(o))return o.map(dc);
    if(o.constructor!==Object)return o; /* AudioBuffer & friends: keep by ref */
    const c={};for(const k in o)c[k]=dc(o[k]);return c;
  };
  const loopOsc=ref=>{
    const p=S.configs[ref.patchKey];
    return (p&&p.oscillators)?p.oscillators[ref.oscIdx]:null;
  };
  const voscs=tracks.map(t=>{
    const tim=loopOsc(t.timbre);
    if(!tim)throw new Error('Score track "'+(t.name||'?')+'" has a bad timbre reference');
    const m=dc(tim);
    const lc=loopOsc(t.timbre);
    if(lc)for(let i=0;i<PAT.length;i++){const k=PAT[i];if(lc[k]!==undefined)m[k]=dc(lc[k]);}
    m.label=t.name;m.muted=false;
    return m;
  });
  const baseVol=voscs.map(o=>o.volume);
  const curClip=voscs.map(()=>null);
  const iso=tracks.some(t=>t.solo);
  const scoreHook=(oscCfg,oi,bar,step)=>{
    const t=tracks[oi];if(!t)return false;
    const spb=meterStepsAtBar(bar);
    const pos=bar+step/spb;
    let best=null;
    for(let i=0;i<t.clips.length;i++){const c=t.clips[i];
      if(pos>=c.startBar&&pos<c.startBar+c.bars){
        if(!best||c.startBar>=best.startBar)best=c; /* overlap: topmost wins */
      }}
    let changed=false;
    const bk=best?best.id:null;
    if(bk!==curClip[oi]){
      curClip[oi]=bk;
      if(best){const lc=loopOsc(best.loop);
        if(lc){for(let i=0;i<PAT.length;i++){const k=PAT[i];if(lc[k]!==undefined)oscCfg[k]=dc(lc[k]);}changed=true;}}
    }
    let f=0;
    if(best){
      const into=pos-best.startBar,left=best.startBar+best.bars-pos;
      f=1;
      if(best.fadeIn>0)f=Math.min(f,into/best.fadeIn);
      if(best.fadeOut>0)f=Math.min(f,left/best.fadeOut);
      if(f<0)f=0;if(f>1)f=1;
    }
    oscCfg.volume=(t.muted||(iso&&!t.solo)||!best)?0:baseVol[oi]*f;
    return changed;
  };
  let bars=1;
  tracks.forEach(t=>t.clips.forEach(c=>{bars=Math.max(bars,c.startBar+c.bars);}));
  if(S.score.endBar>0)bars=S.score.endBar; /* explicit end marker: clips past it are cut */
  const rendered=await renderToWAV(bars,onProgress,{
    patch:{type:'synth',name:'Score',color:'#0ff',oscillators:voscs},
    scoreHook:scoreHook,
    mix:{drumVol:S.drumVol},
    stepValueKey:S.stepValueKey,swing:S.swing,bpm:S.bpm,stepCount:S.stepCount,meterChanges:S.meterChanges});
  renderScoreToWAV.lastBars=bars;
  return rendered;
}

// ── MIDI FILE EXPORT ─────────────────────────────────────────────────────
function varLen(n){if(n<128)return[n];const b=[];let v=n;b.unshift(v&0x7F);v>>=7;while(v>0){b.unshift((v&0x7F)|0x80);v>>=7;}return b;}

function exportMIDI(){
  if(S.currentType==='__score'){setStatus('Score is playing — use Export Score MIDI for the arrangement, or stop the score to export a patch');return;}
  const sv=STEP_VALUES.find(s=>s.key===S.stepValueKey)||STEP_VALUES[5];
  const tpq=480;
  const qPerStep=sv.mult;
  const tps=Math.round(tpq*qPerStep);
  const uspb=Math.round(60000000/S.bpm);
  const cfg=S.configs[S.currentType];
  const hasMelody=cfg.oscillators.filter(o=>o.melody&&o.melody.length>0);
  const tracks=hasMelody.length>0?hasMelody:cfg.oscillators;

  // Least-common-multiple helper for loop length
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  const lcm=(a,b)=>a/gcd(a,b)*b;

 const buildTrack=(oscCfg,ch)=>{
  const evts=[];
  evts.push({tick:0,data:[0xFF,0x51,0x03,(uspb>>16)&0xFF,(uspb>>8)&0xFF,uspb&0xFF]});
  const nameBytes=[...(oscCfg.label||('OSC '+(ch+1)))].map(c=>c.charCodeAt(0));
  evts.push({tick:0,data:[0xFF,0x03,nameBytes.length,...nameBytes]});
  const pan=Math.round(((oscCfg.pan||0)+1)*63.5);
  evts.push({tick:0,data:[0xB0|ch,0x0A,pan]});
  // volume CC: normalise oscCfg.volume (0..0.15 range) to 0..127
  const volCC=Math.min(127,Math.round((oscCfg.volume||0.04)/0.15*127));
  evts.push({tick:0,data:[0xB0|ch,0x07,volCC]});

  const steps=resizeSteps(oscCfg.steps,oscCfg.steps&&oscCfg.steps.length?oscCfg.steps.length:S.stepCount);
  const melody=oscCfg.melody||[];
  // Loop length = LCM of step length and melody length (capped at 128 steps)
  const rawLcm=melody.length>0?lcm(steps.length,melody.length):steps.length;
  const loopLen=Math.min(128,rawLcm)*4; // 4 repetitions for arrangement
  // v18.0: time-signature metas for every meter change inside the exported range.
  meterList().forEach(e=>{if(e.num==null||e.den==null)return;const mtick=meterStepForBar(e.bar)*tps;if(mtick<loopLen*tps||e.bar===0)evts.push({tick:mtick,data:[0xFF,0x58,0x04,e.num,Math.max(0,Math.min(7,Math.round(Math.log2(e.den)))),24,8]});});

  // Pass 1 (v13.7): collect sounded notes in rep order
  const sounded=[];
  const arpStep=(oscCfg.arpEnabled&&!NOISE_WAVES.has(oscCfg.wave))?makeArpStepper(oscCfg):null;
  const arpRateEff=arpStep?Math.max(0.25,Math.min(4,oscCfg.arpRate||1)):1;
  for(let rep=0;rep<loopLen;rep++){
    const oscStep=Math.floor(rep*(oscCfg.rateMult||1))%steps.length; // same phase rule as seqTick
    const vel=steps[oscStep]||0;if(!vel)continue;
    const tick=rep*tps;
    const prob=(oscCfg.stepProbs&&oscCfg.stepProbs.length>oscStep)?(oscCfg.stepProbs[oscStep]??100):100;
    if(prob<100&&Math.random()*100>=prob)continue;

    const locks=oscCfg.stepLocks&&oscCfg.stepLocks[oscStep];
    const accent=(oscCfg.stepAccents&&oscCfg.stepAccents.length>oscStep)?(oscCfg.stepAccents[oscStep]??1):1;

    // v15.19: sub-step arp — N note-on/off pairs per step, each advancing
    // the cursor; gate = arpGate × (tps / N) ticks. Skips the single-note
    // push at the bottom of the loop.
    if(arpStep)arpStep.at(oscStep);
    if(arpStep&&arpRateEff>1){
      const subCount=Math.round(arpRateEff);
      const subTicks=Math.round(tps/subCount);
      const subGateTicks=Math.round(subTicks*Math.max(0.02,Math.min(1,oscCfg.arpGate||0.5)));
      const pitchLock=(locks&&locks.pitch)?Math.round(locks.pitch):0;
      const mv2=Math.min(127,Math.max(1,Math.round(vel*accent*100)));
      for(let k=0;k<subCount;k++){
        const ahz=arpStep.nextNote();
        let mn=midiNoteForFreq(ahz)+pitchLock;
        mn=Math.max(0,Math.min(127,mn));
        sounded.push({rep,tick:tick+k*subTicks,noteNum:mn,mv2,gateTicks:subGateTicks,subIdx:k});
      }
      continue;
    }

    let noteNum=60,arpGate=null;
    if(arpStep){
      // arp wins over melody, exactly as in seqTick
      const ahz=arpStep(rep%S.stepCount);noteNum=midiNoteForFreq(ahz);arpGate=oscCfg.arpGate||0.5;
    } else if(melody.length){
      const slot=melody[oscStep%melody.length];
      if(slot){const m=noteToMidi(slot.note,slot.octave);if(m!=null)noteNum=m;}
    } else {
      const det=hzToNote(oscCfg.freq);if(det){const m=noteToMidi(det.name,det.octave);if(m!=null)noteNum=m;}
    }
    if(locks&&locks.pitch)noteNum+=Math.round(locks.pitch);
    noteNum=Math.max(0,Math.min(127,noteNum));

    // velocity: step level × slot vel if present, scaled 1..127
    let slotVel=1;
    if(!arpStep&&melody.length){const slot=melody[oscStep%melody.length];if(slot&&slot.vel!==undefined)slotVel=slot.vel;}
    const mv2=Math.min(127,Math.max(1,Math.round(vel*slotVel*accent*100)));
    const sdm=(oscCfg.stepDurs&&oscCfg.stepDurs.length>oscStep)?(oscCfg.stepDurs[oscStep]||1):1;
    const gateTicks=arpGate!=null?Math.round(tps*Math.max(0.02,Math.min(1,arpGate))):Math.round(tps*sdm*(oscCfg.gateTime||1)*.85);

    sounded.push({rep,tick,noteNum,mv2,gateTicks,subIdx:0});
  }

  // Pass 2 (v13.7): emit notes + glide pitch-bends, mirroring the live engine —
  // bend starts at the old pitch right after the new note-on and interpolates
  // (linear in semitones == exponential in Hz) to center. Only between
  // consecutively sounded steps: rests break the chain, like live. No clamping —
  // bend range is the owner's business (S.midiBendRange must match the synth).
  const glideSec=(!NOISE_WAVES.has(oscCfg.wave))?(oscCfg.glide||0):0; // live: (lockable && !isNoise)
  const bendRange=S.midiBendRange||2;
  const bendBytes=st=>{const norm=Math.max(-1,Math.min(1,st/bendRange));const v=Math.round((norm+1)/2*16383);return [v&0x7F,(v>>7)&0x7F];};
  sounded.forEach((s,idx)=>{
    evts.push({tick:s.tick,data:[0x90|ch,s.noteNum,s.mv2]});
    evts.push({tick:s.tick+s.gateTicks,data:[0x80|ch,s.noteNum,0]});
    const prev=idx>0?sounded[idx-1]:null;
    // v15.19: rep is the step index, subIdx the position within it. Two
    // within-step sub-notes are adjacent; the first sub-note of step N is
    // adjacent to the last entry of step N-1. A rest still breaks the chain:
    // its rep sits one lower, so neither branch matches across the gap.
    const adjacent=prev&&(
      (s.rep===prev.rep&&s.subIdx===prev.subIdx+1)||
      s.rep===prev.rep+1
    );
    if(glideSec>0.001&&prev&&adjacent&&s.noteNum!==prev.noteNum){
      const deltaSt=s.noteNum-prev.noteNum;
      const glideTicks=Math.round(glideSec*tpq*S.bpm/60);
      const nextTick=idx+1<sounded.length?sounded[idx+1].tick:Infinity;
      const endTick=Math.min(s.tick+glideTicks,nextTick);
      if(endTick>s.tick){
        const n=Math.max(2,Math.min(64,Math.round((endTick-s.tick)/24)));
        for(let k=0;k<=n;k++){
          const t=s.tick+Math.round((endTick-s.tick)*k/n);
          const bst=k===n?0:-deltaSt*(1-k/n);
          const [lsb,msb]=bendBytes(bst);
          evts.push({tick:t,data:[0xE0|ch,lsb,msb]});
        }
      }
    }
  });
  evts.push({tick:loopLen*tps,data:[0xFF,0x2F,0x00]});
  evts.sort((a,b)=>a.tick-b.tick);

  const bytes=[];let cur=0;
  evts.forEach(e=>{const delta=e.tick-cur;cur=e.tick;bytes.push(...varLen(delta),...e.data);});
  return bytes;
};
  const numTracks=tracks.length;
  const headerBytes=[0x4D,0x54,0x68,0x64,0x00,0x00,0x00,0x06,0x00,0x01,0x00,numTracks,(tpq>>8)&0xFF,tpq&0xFF];
  const trackChunks=[];
  tracks.forEach((osc,i)=>{
    const tb=buildTrack(osc,i%16);
    const len=tb.length;
    trackChunks.push(0x4D,0x54,0x72,0x6B,(len>>24)&0xFF,(len>>16)&0xFF,(len>>8)&0xFF,len&0xFF,...tb);
  });
  const all=new Uint8Array([...headerBytes,...trackChunks]);
  const blob=new Blob([all],{type:'audio/midi'});
  const name=(S.configs[S.currentType].name||'caloris').replace(/\s+/g,'_');
  downloadBlob(blob,withExportRoot(name)+'.mid');
  setStatus('MIDI exported: '+tracks.length+' track'+(tracks.length===1?'':'s'));
}


// ── v18.0 SCORE MIDI EXPORT ────────────────────────────────────────────
// Bounces the score arrangement (S.score) to SMF Type 1 without requiring
// playback. Mirrors renderScoreToWAV: virtual voices from track timbres,
// active clip patterns via the same PAT keys, overlap rule "latest startBar
// wins", gaps = silence, mutes/solos honoured, endBar/contentBars as the end.
// One pass through the arrangement, never a loop repetition. Pattern phase
// follows the live rule: floor(absStep * rateMult) % patternLength, where
// absStep is the global step count from the meter map, so a clip that starts
// after a meter change still phases exactly like live playback.
function exportScoreMIDI(){
  if(window.SCORE&&typeof SCORE.sanitize==='function')SCORE.sanitize();
  const tracks=(S.score&&S.score.tracks)||[];
  if(!tracks.length){setStatus('Score is empty — add a track first');return;}
  const sv=STEP_VALUES.find(s=>s.key===S.stepValueKey)||STEP_VALUES[5];
  const tpq=480;
  const tps=Math.round(tpq*sv.mult);
  const uspb=Math.round(60000000/S.bpm);
  let endB=0;
  tracks.forEach(tr=>tr.clips.forEach(c=>{endB=Math.max(endB,c.startBar+c.bars);}));
  if(S.score.endBar>0)endB=S.score.endBar;
  if(endB<=0){setStatus('Score is empty — add a track first');return;}
  const totalSteps=meterTotalSteps(endB);
  const totalTicks=totalSteps*tps;
  const iso=tracks.some(tr=>tr.solo);
  const PAT=['steps','stepData','stepDurs','stepProbs','stepAccents','stepLocks',
    'melody','melodyOctave','gateTime','rateMult','freq',
    'arpEnabled','arpMode','arpPool','arpOctaves','arpRate','arpGate'];
  const dc=o=>{
    if(o===null||typeof o!=='object')return o;
    if(Array.isArray(o))return o.map(dc);
    if(o.constructor!==Object)return o;
    const c={};for(const k in o)c[k]=dc(o[k]);return c;
  };
  const loopOsc=ref=>{
    const p=S.configs[ref.patchKey];
    return (p&&p.oscillators)?p.oscillators[ref.oscIdx]:null;
  };
  const timeSigEvts=()=>{
    const out=[];
    meterList().forEach(e=>{
      if(e.num==null||e.den==null)return;
      const mtick=meterStepForBar(e.bar)*tps;
      if(mtick<totalTicks||e.bar===0)out.push({tick:mtick,data:[0xFF,0x58,0x04,e.num,Math.max(0,Math.min(7,Math.round(Math.log2(e.den)))),24,8]});
    });
    return out;
  };
  const bendRange=S.midiBendRange||2;
  const bendBytes=st=>{const norm=Math.max(-1,Math.min(1,st/bendRange));const v=Math.round((norm+1)/2*16383);return [v&0x7F,(v>>7)&0x7F];};
  const trackChunks=[];
  let scoreTrackCount=0;
  tracks.forEach((tr,ti)=>{
    if(tr.muted||(iso&&!tr.solo))return;
    const tim=loopOsc(tr.timbre);
    if(!tim)return;
    scoreTrackCount++;
    const base=dc(tim);
    const ch=(base.midiChannel!=null)?(base.midiChannel-1):(ti%16);
    const evts=[];
    evts.push({tick:0,data:[0xFF,0x51,0x03,(uspb>>16)&0xFF,(uspb>>8)&0xFF,uspb&0xFF]});
    const nameBytes=[...(tr.name||('Track '+(ti+1)))].map(c=>c.charCodeAt(0));
    evts.push({tick:0,data:[0xFF,0x03,nameBytes.length,...nameBytes]});
    const pan=Math.round(((base.pan||0)+1)*63.5);
    evts.push({tick:0,data:[0xB0|ch,0x0A,pan]});
    const volCC=Math.min(127,Math.round((base.volume||0.04)/0.15*127));
    evts.push({tick:0,data:[0xB0|ch,0x07,volCC]});
    timeSigEvts().forEach(e=>evts.push(e));
    const sounded=[];
    let curClipId=null,curPat=null;
    let arpSeq=null,arpIdx=0,arpLast=base.freq,arpBar=-1;
    const arpPoolHz=(bar,stepsInBar,patOsc)=>{
      const seen=new Set(),pool=[];
      const stepsV2=resizeSteps(patOsc.steps,patOsc.steps&&patOsc.steps.length?patOsc.steps.length:S.stepCount);
      const mel2=patOsc.melody||[];
      for(let s2=0;s2<stepsInBar;s2++){
        const abs2=meterStepForBar(bar)+s2;
        const os2=Math.floor(abs2*(patOsc.rateMult||1))%stepsV2.length;
        if(!(stepsV2[os2]>0))continue;
        const slot=mel2[os2%mel2.length];
        if(!slot)continue;
        const hz=noteToHz(slot.note,slot.octave);
        if(!seen.has(hz)){seen.add(hz);pool.push(hz);}
      }
      if(!pool.length)mel2.filter(s=>s).forEach(s=>{const hz=noteToHz(s.note,s.octave);if(!seen.has(hz)){seen.add(hz);pool.push(hz);}});
      return pool;
    };
    const arpOrder=(pool,oscCfg)=>{
      const base2=[...pool];
      let notes=[];
      const octs=Math.max(1,Math.min(4,oscCfg.arpOctaves||1));
      for(let o=0;o<octs;o++)notes=notes.concat(base2.map(hz=>hz*Math.pow(2,o)));
      return _orderArp(notes,oscCfg.arpMode||'up',oscCfg);
    };
    for(let bar=0;bar<endB;bar++){
      const stepsInBar=meterStepsAtBar(bar);
      for(let step=0;step<stepsInBar;step++){
        const absStep=meterStepForBar(bar)+step;
        const pos=bar+step/stepsInBar;
        let best=null;
        tr.clips.forEach(c=>{if(pos>=c.startBar&&pos<c.startBar+c.bars){if(!best||c.startBar>=best.startBar)best=c;}});
        let f=0;
        if(best){
          const into=pos-best.startBar,left=best.startBar+best.bars-pos;
          f=1;
          if(best.fadeIn>0)f=Math.min(f,into/best.fadeIn);
          if(best.fadeOut>0)f=Math.min(f,left/best.fadeOut);
          if(f<0)f=0;if(f>1)f=1;
        }
        if(!best||f===0){curClipId=null;curPat=null;continue;}
        if(best.id!==curClipId){curClipId=best.id;const lc=loopOsc(best.loop);curPat=lc?dc(lc):null;}
        if(!curPat)continue;
        const oscCfg=Object.assign({},base);
        PAT.forEach(k=>{if(curPat[k]!==undefined)oscCfg[k]=curPat[k];});
        const stepsV=resizeSteps(oscCfg.steps,oscCfg.steps&&oscCfg.steps.length?oscCfg.steps.length:S.stepCount);
        const oscStep=Math.floor(absStep*(oscCfg.rateMult||1))%stepsV.length;
        const isDrumVoice=DRUM_WAVES.has(oscCfg.wave);
        const locks=oscCfg.stepLocks&&oscCfg.stepLocks[oscStep];
        const pitchLock=(locks&&locks.pitch)?Math.round(locks.pitch):0;
        const accent=(oscCfg.stepAccents&&oscCfg.stepAccents.length>oscStep)?(oscCfg.stepAccents[oscStep]??1):1;
        const tick=absStep*tps;
        if(isDrumVoice&&oscCfg.stepData&&oscCfg.stepData.length){
          const entry=oscCfg.stepData[oscStep%oscCfg.stepData.length];
          if(entry&&entry.on){
            const dch=(oscCfg.midiChannel!=null)?(oscCfg.midiChannel-1):9;
            const dmn=Number.isFinite(oscCfg.midiNote)?Math.max(0,Math.min(127,oscCfg.midiNote)):36;
            const dmv=Math.min(127,Math.max(1,Math.round((entry.vel??1)*accent*f*100)));
            sounded.push({rep:absStep,tick:tick,noteNum:dmn,mv2:dmv,gateTicks:Math.round(tps*0.5),subIdx:0,ch:dch});
          }
          continue;
        }
        const vel=stepsV[oscStep]||0;
        if(!vel)continue;
        const prob=(oscCfg.stepProbs&&oscCfg.stepProbs.length>oscStep)?(oscCfg.stepProbs[oscStep]??100):100;
        if(prob<100&&Math.random()*100>=prob)continue;
        if(oscCfg.arpEnabled&&!NOISE_WAVES.has(oscCfg.wave)){
          if(oscCfg.arpPool==='bar'&&bar!==arpBar){
            arpSeq=arpOrder(arpPoolHz(bar,stepsInBar,oscCfg),oscCfg);arpIdx=0;arpBar=bar;arpLast=arpSeq.length?arpSeq[0]:oscCfg.freq;
          }
          if(arpSeq===null){
            const seen=new Set(),pool=[];
            (oscCfg.melody||[]).filter(s=>s).forEach(s=>{const hz=noteToHz(s.note,s.octave);if(!seen.has(hz)){seen.add(hz);pool.push(hz);}});
            arpSeq=arpOrder(pool.length?pool:[oscCfg.freq],oscCfg);arpIdx=0;arpLast=arpSeq.length?arpSeq[0]:oscCfg.freq;
          }
          const arpRateEff=Math.max(0.25,Math.min(4,oscCfg.arpRate||1));
          const arpNext=()=>{
            let hz;
            if(oscCfg.arpMode==='random')hz=arpSeq[Math.floor(Math.random()*arpSeq.length)];
            else{hz=arpSeq[arpIdx%arpSeq.length];arpIdx=(arpIdx+1)%arpSeq.length;}
            arpLast=hz;return hz;
          };
          if(arpRateEff>1){
            const subCount=Math.round(arpRateEff);
            const subTicks=Math.round(tps/subCount);
            const subGateTicks=Math.round(subTicks*Math.max(0.02,Math.min(1,oscCfg.arpGate||0.5)));
            const mv2=Math.min(127,Math.max(1,Math.round(vel*accent*f*100)));
            for(let k=0;k<subCount;k++){
              let mn=midiNoteForFreq(arpNext())+pitchLock;
              mn=Math.max(0,Math.min(127,mn));
              sounded.push({rep:absStep,tick:tick+k*subTicks,noteNum:mn,mv2:mv2,gateTicks:subGateTicks,subIdx:k,ch:ch});
            }
          } else {
            const stride=Math.round(1/arpRateEff);
            let hz;
            if(stride<=1||(absStep%stride===0))hz=arpNext();else hz=arpLast;
            let mn=midiNoteForFreq(hz)+pitchLock;
            mn=Math.max(0,Math.min(127,mn));
            const mv2=Math.min(127,Math.max(1,Math.round(vel*accent*f*100)));
            const gateTicks=Math.round(tps*Math.max(0.02,Math.min(1,oscCfg.arpGate||0.5)));
            sounded.push({rep:absStep,tick:tick,noteNum:mn,mv2:mv2,gateTicks:gateTicks,subIdx:0,ch:ch});
          }
          continue;
        }
        let noteNum=60,slotVel=1;
        if(oscCfg.melody&&oscCfg.melody.length){
          const slot=oscCfg.melody[oscStep%oscCfg.melody.length];
          if(slot){const m=noteToMidi(slot.note,slot.octave);if(m!=null)noteNum=m;if(slot.vel!==undefined)slotVel=slot.vel;}
        } else {
          const det=hzToNote(oscCfg.freq);if(det){const m=noteToMidi(det.name,det.octave);if(m!=null)noteNum=m;}
        }
        noteNum+=pitchLock;noteNum=Math.max(0,Math.min(127,noteNum));
        const mv2=Math.min(127,Math.max(1,Math.round(vel*slotVel*accent*f*100)));
        const sdm=(oscCfg.stepDurs&&oscCfg.stepDurs.length>oscStep)?(oscCfg.stepDurs[oscStep]||1):1;
        const gateTicks=Math.round(tps*sdm*(oscCfg.gateTime||1)*0.85);
        sounded.push({rep:absStep,tick:tick,noteNum:noteNum,mv2:mv2,gateTicks:gateTicks,subIdx:0,ch:ch});
      }
    }
    const glideSec=(!NOISE_WAVES.has(base.wave))?(base.glide||0):0;
    sounded.forEach((s,idx)=>{
      const cch=(s.ch!=null)?s.ch:ch;
      evts.push({tick:s.tick,data:[0x90|cch,s.noteNum,s.mv2]});
      evts.push({tick:s.tick+s.gateTicks,data:[0x80|cch,s.noteNum,0]});
      const prev=idx>0?sounded[idx-1]:null;
      const adjacent=prev&&((s.rep===prev.rep&&s.subIdx===prev.subIdx+1)||s.rep===prev.rep+1);
      if(glideSec>0.001&&prev&&adjacent&&s.noteNum!==prev.noteNum){
        const deltaSt=s.noteNum-prev.noteNum;
        const glideTicks=Math.round(glideSec*tpq*S.bpm/60);
        const nextTick=idx+1<sounded.length?sounded[idx+1].tick:Infinity;
        const endTick=Math.min(s.tick+glideTicks,nextTick);
        if(endTick>s.tick){
          const n=Math.max(2,Math.min(64,Math.round((endTick-s.tick)/24)));
          for(let k=0;k<=n;k++){
            const tt=s.tick+Math.round((endTick-s.tick)*k/n);
            const bst=k===n?0:-deltaSt*(1-k/n);
            const lsbMsb=bendBytes(bst);
            evts.push({tick:tt,data:[0xE0|cch,lsbMsb[0],lsbMsb[1]]});
          }
        }
      }
    });
    evts.push({tick:totalTicks,data:[0xFF,0x2F,0x00]});
    evts.sort((a,b)=>a.tick-b.tick);
    const bytes=[];let cur=0;
    evts.forEach(e=>{const delta=e.tick-cur;cur=e.tick;bytes.push(...varLen(delta),...e.data);});
    const len=bytes.length;
    trackChunks.push(0x4D,0x54,0x72,0x6B,(len>>24)&0xFF,(len>>16)&0xFF,(len>>8)&0xFF,len&0xFF,...bytes);
  });
  if(!trackChunks.length){setStatus('Score MIDI: no audible tracks');return;}
  const headerBytes=[0x4D,0x54,0x68,0x64,0x00,0x00,0x00,0x06,0x00,0x01,0x00,scoreTrackCount,(tpq>>8)&0xFF,tpq&0xFF];
  const all=new Uint8Array([...headerBytes,...trackChunks]);
  downloadBlob(new Blob([all],{type:'audio/midi'}),withExportRoot('score')+'.mid');
  setStatus('Score MIDI exported: '+scoreTrackCount+' track'+(scoreTrackCount===1?'':'s')+' · '+endB+' bars');
}

// ── MIDI FILE IMPORT ─────────────────────────────────────────────────────
function parseMIDI(ab){
  const view=new DataView(ab);let pos=0;
  const rs=n=>{const v=view.getUint8(pos);pos++;return v;};
  const ru16=()=>{const v=view.getUint16(pos);pos+=2;return v;};
  const ru32=()=>{const v=view.getUint32(pos);pos+=4;return v;};
  const rStr=n=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(rs());return s;};
  const rVarLen=()=>{let v=0,b;do{b=rs();v=(v<<7)|(b&0x7F);}while(b&0x80);return v;};

  if(rStr(4)!=='MThd')throw new Error('Not a MIDI file');
  ru32();

function crossfade(targetKey) {

  renderPatchTabs();
  updateDynamicUI();
}

function makeCollapsible(headerText,headerColor,content,startOpen=false){

function makeWaveSelect(current,onChange){

function makeFxBadges(cfg,color){

}

function renderKitGrid(typeKey) {
  const container = document.getElementById('kit-grid-body');
  if (!container) return;
  container.innerHTML = '';
  const cfg = S.configs[typeKey];
  if (cfg.type !== 'kit') {
    container.textContent = 'This patch is not a drum kit. Switch to Edit view to change type.';
    return;
  }
  const pads = cfg.oscillators;
  if (!pads.length) {
    container.textContent = 'No pads — add oscillators in Edit view first.';
    return;
  }
  const maxSteps = S.stepCount;
  const color = cfg.color;

  const table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;border:1px solid ' + color + '33;background:#000a00';

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const corner = document.createElement('th');
  corner.style.cssText = 'font-size:9px;color:' + color + '99;padding:2px;text-align:left;min-width:70px';
  corner.textContent = 'PAD';
  headRow.appendChild(corner);
  for (let s = 0; s < maxSteps; s++) {
    const th = document.createElement('th');
    th.style.cssText = 'font-size:8px;color:' + color + '55;padding:1px;text-align:center;width:24px';
    th.textContent = s + 1;
    headRow.appendChild(th);
  }
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  pads.forEach((pad, padIdx) => {
    const row = document.createElement('tr');
    const labelCell = document.createElement('td');
    labelCell.style.cssText = 'font-size:10px;padding:2px 4px;color:' + (pad.muted ? '#555' : color);
    const nameSpan = document.createElement('span');
    nameSpan.textContent = pad.label || ('PAD ' + (padIdx + 1));
    nameSpan.style.cursor = 'pointer';
    labelCell.appendChild(nameSpan);
    row.appendChild(labelCell);

    if (!pad.stepData || pad.stepData.length !== maxSteps) {
      pad.stepData = Array(maxSteps).fill(null).map(() => ({
        on: 0, vel: 1, pitch: 0, decay: 1
      }));
    }

    for (let s = 0; s < maxSteps; s++) {
      const sd = pad.stepData[s];
      const td = document.createElement('td');
      td.style.cssText = 'padding:0;text-align:center';
      const btn = document.createElement('button');
      btn.className = 'step-btn';
      btn.style.width = '100%';
      btn.style.height = '20px';
      btn.style.fontSize = '8px';
      btn.dataset.pad = padIdx;
      btn.dataset.step = s;
      btn.dataset.len = maxSteps;
      updateStepButtonAppearance(btn, sd, color);
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        sd.on = sd.on ? 0 : 1;
        updateStepButtonAppearance(btn, sd, color);
      });
      btn.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showStepEditor(pad, padIdx, s, cfg, typeKey, btn);
      });
      td.appendChild(btn);
      row.appendChild(td);
    }
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  container.appendChild(table);

  const clearBtn = document.createElement('button');
  clearBtn.textContent = 'Clear All Steps';
  clearBtn.style.marginTop = '4px';
  clearBtn.addEventListener('click', () => {
    pads.forEach(pad => {
      if (pad.stepData) pad.stepData.forEach(sd => sd.on = 0);
    });
    renderKitGrid(typeKey);
  });
  container.appendChild(clearBtn);
}

function updateStepButtonAppearance(btn, sd, color) {
  btn.dataset.vel = sd.on ? (sd.vel || 1) : 0; // read by updateStepUI for the 'fired' flash
  if (sd.on) {
    btn.classList.add('vel-full');
    btn.style.borderColor = color;
    btn.style.color = color;
    btn.style.background = color + 'bb';
    btn.textContent = '⚊';
  } else {
    btn.classList.remove('vel-full', 'vel-half');
    btn.style.borderColor = color + '33';
    btn.style.color = color + '33';
    btn.style.background = 'transparent';
    btn.textContent = '·';
  }
}

function showStepEditor(pad, padIdx, step, cfg, typeKey, triggerBtn) {
  const sd = pad.stepData[step];
  const popup = document.createElement('div');
  popup.style.cssText = 
    'position:fixed;z-index:5000;background:#001800;border:2px solid #0f0;' +
    'padding:8px;border-radius:4px;font-size:10px;color:#0f0;' +
    'box-shadow:0 0 12px #0f0;min-width:200px';
  
  const fields = [
    { label: 'Velocity', prop: 'vel', min: 0, max: 1, step: 0.1, val: sd.vel },
    { label: 'Pitch (semi)', prop: 'pitch', min: -12, max: 12, step: 1, val: sd.pitch },
    { label: 'Decay mult', prop: 'decay', min: 0.1, max: 2, step: 0.1, val: sd.decay }
  ];

  fields.forEach(f => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:4px;margin:3px 0';
    const lbl = document.createElement('label');
    lbl.textContent = f.label + ':';
    lbl.style.width = '70px';
    const slider = document.createElement('input');
    slider.type = 'range';slider.setAttribute('aria-label',f.label);
    slider.min = f.min;
    slider.max = f.max;
    slider.step = f.step;
    slider.value = f.val;
    slider.style.flex = '1';
    const valDisplay = document.createElement('span');
    valDisplay.style.width = '30px';
    valDisplay.textContent = f.val;
    slider.addEventListener('input', () => {
      sd[f.prop] = parseFloat(slider.value);
      valDisplay.textContent = sd[f.prop];
    });
    row.appendChild(lbl);
    row.appendChild(slider);
    row.appendChild(valDisplay);
    popup.appendChild(row);
  });

  const closeBtn = document.createElement('button');
  closeBtn.textContent = 'Close';
  closeBtn.addEventListener('click', () => {
    popup.remove();
    const btn = document.querySelector(`[data-pad="${padIdx}"][data-step="${step}"]`);
    if (btn) updateStepButtonAppearance(btn, sd, cfg.color);
  });
  popup.appendChild(closeBtn);

  const rect = triggerBtn.getBoundingClientRect();
  popup.style.left = rect.left + 'px';
  popup.style.top = (rect.bottom + 4) + 'px';
  document.body.appendChild(popup);
  setTimeout(()=>{
    const dismiss=e=>{if(popup.contains(e.target))return;popup.remove();document.removeEventListener('mousedown',dismiss,true);};
    document.addEventListener('mousedown',dismiss,true);
  },0);
}

// Incremental card rendering: rebuild one oscillator card in place instead of
// the whole UI. Card edits only ever touch their own cfg, so the rest of the
// DOM is left alone. Falls back to render() whenever the card isn't on screen.
function renderCard(typeKey,oscIdx){
  if(S.patchView!=='edit'){render();return;}
  const container=document.getElementById('osc-cards');if(!container){render();return;}
  const cfg=S.configs[typeKey];if(!cfg||oscIdx<0||oscIdx>=cfg.oscillators.length){render();return;}
  const cards=container.querySelectorAll(':scope > .osc-card');
  if(oscIdx>=cards.length){render();return;}
  cards[oscIdx].replaceWith(makeOscCard(cfg.oscillators[oscIdx],oscIdx,typeKey));
  updateDynamicUI(); // undo depth changed via pushUndo()
}

}

function updateStepUI(step){
  // v13.2: playheads follow each voice's live phase (osc._phase). Buttons that can't be
  // mapped to a voice fall back to the grid position (identical when the voice length
  // divides the grid, which covers all pre-v13.2 patches).
  const oscs=(S.configs[S.currentType]||{oscillators:[]}).oscillators;
  const voicePhase=b=>{
    let idx=-1;const tr=b.dataset.track||'';
    if(tr.indexOf('osc-')===0||tr.indexOf('score-')===0){const p=tr.split('-');idx=parseInt(p[p.length-1]);}
    else if(b.dataset.pad!==undefined&&b.dataset.pad!=='')idx=parseInt(b.dataset.pad);
    if(idx>=0&&oscs[idx]&&oscs[idx]._phase!==undefined)return oscs[idx]._phase;
    return null;
  };
  document.querySelectorAll('.step-btn').forEach(b=>{const stepIdx=parseInt(b.dataset.step),vp=voicePhase(b),cur=vp!==null?vp:step%parseInt(b.dataset.len||S.stepCount),isCurrent=step>=0&&seqRunning&&stepIdx===cur;b.classList.toggle('current',isCurrent);if(isCurrent&&parseFloat(b.dataset.vel||0)>0){b.classList.remove('fired');void b.offsetWidth;b.classList.add('fired');}});
  document.querySelectorAll('.melody-btn').forEach(b=>{const stepIdx=parseInt(b.dataset.step),melLen=parseInt(b.dataset.mellen||1),vp=voicePhase(b),cur=vp!==null?vp%melLen:step%melLen;b.classList.toggle('current',step>=0&&seqRunning&&stepIdx===cur);});
}

  document.querySelectorAll('[data-stepcount]').forEach(b=>{const active=S.stepCount===parseInt(b.dataset.stepcount);b.style.borderColor=active?'#ff0':'#ff04';b.style.color=active?'#ff0':'#ff04';b.style.background=active?'rgba(255,255,0,0.08)':'transparent';});

  // Drum bus volume (when kit active)

// ── v15: baked-in patch schema ─────────────────────────────────────────
// CALORIS_SCHEMA_TEXT is CALORIS_patch_schema.md embedded verbatim (the source of truth).
const CALORIS_SCHEMA_TEXT="# CALORIS Patch JSON Schema (v14)\n\nImport path: **\"\u25c0 Paste\" / \"\u25c0 File\"** in the JSON section (\"Paste CALORIS JSON here\u2026\").\nContract extracted from `doImport()` in `CALORIS_v14_0_adsa.html`. Feed this file \u2014\nnot the 295KB app \u2014 to a composer (human or agent).\n\n## Top level\n\n`{version, patches, sequencer, key, master, chain, weightedPool, weightedPoolLayer}`\n\n- `version`: number. **Ignored on import** (exporter writes `5`). Informational only.\n- `patches`: **REQUIRED.** Object mapping patch-key \u2192 patch object. Legacy alias\n  `dungeonAudio` is accepted. Missing \u2192 import fails loudly (`\"Missing patches\"`).\n  Must contain the currently selected patch key \u2014 on a fresh boot that is `init`,\n  otherwise the import errors.\n- `sequencer`, `key`, `master`: optional; an omitted section leaves current values alone.\n- Unknown top-level fields are silently ignored.\n\n## sequencer \u2014 all fields optional, applied only when present\n\n- `bpm`: number (UI offers 20\u2013300; import does not validate).\n- `stepCount`: steps per bar (UI offers 2\u201314, 16, 24, 32; import accepts any).\n- `swing`: ms added to odd steps, 0\u201380. Applied when `!== undefined`.\n- `stepValueKey`: one of `w h q qd tq e ed te s ts` (whole \u2192 triplet-16th).\n  Unknown keys are silently ignored.\n- `stepValueMult`: **IGNORED on import** (re-derived from `stepValueKey`). Do not write it.\n\n## key\n\n- `rootNote`: default `'C'`. Must be one of `C C# D D# E F F# G G# A A# B`\n  (sharps only); anything else corrupts the derived scale notes.\n- `scaleKey`: default `'chromatic'`; unknown keys fall back to chromatic. Valid:\n  `chromatic major minor dorian phrygian lydian mixolydian locrian blues\n  diminished augmented persian arabic hirajoshi insen kumoi`\n- `scaleName`, `notes`: **IGNORED** (re-derived). Do not write them.\n\n## master\n\n- `volume`: default `0.8`. **Trap:** explicit `0` coerces to `0.8` (`||` fallback).\n- `clipEnabled`: default `true`; only explicit `false` disables.\n- `reverbSize`, `reverbDecay`: applied when truthy.\n- `reverbWetMaster`: applied when `!== undefined`.\n\n## chain \u2014 ordered arrangement (v15.8+)\n\n- `chain`: optional array of `{key, bars, trans}`. Imported into the ordered\n  arrangement chain (`S.chainList`); `S.chainPos` resets to 0.\n- `key`: must match a patch key in `patches`; entries with unknown keys are\n  silently dropped.\n- `bars`: bars to play before advancing (>=1; coerced to at least 1).\n- `trans`: `'fade'` or `'cut'`; anything else coerces to `'fade'`.\n- Omitted or empty \u2192 existing in-memory chain is left unchanged.\n\n## weightedPool \u2014 generative pool (v15.8+)\n\n- `weightedPool`: optional array of `{key, weight}`. Imported into the weighted\n  pool; entries with unknown keys are silently dropped.\n- `weight`: selection weight (>=1; coerced to at least 1). Higher = more likely.\n- `weightedPoolLayer`: optional 1\u20134; which pool layer to load into.\n  Out-of-range values are ignored.\n- Omitted \u2192 existing in-memory pool is left unchanged.\n\n## Patch object\n\n- Key: arbitrary string. Include an `init` patch (fresh boot selects it).\n- `type`: `'synth'` | `'kit'`. Missing \u2192 synth routing (a kit's drums lose the drum bus).\n- `name`: tab label. `color`: CSS color for the tab.\n- `oscillators`: **REQUIRED** array. Missing \u2192 patch is dropped. Empty array\n  or an array with no plain-object voices \u2192 patch is dropped too (counted in\n  the \"N invalid patches skipped\" status; if every patch drops, the import\n  errors with \"No valid patches\").\n\n## Oscillator \u2014 required fields\n\nThe import normalizes every patch through `_normalizePatch`, which filters the\n`oscillators` array to plain objects and runs each survivor through `makeOsc` \u2014\nso most fields are optional and fall back to sane defaults. The only\nimport-level failure is a patch whose `oscillators` array is missing, or\ncontains zero valid voice objects after filtering.\n\nBecause `makeOsc` supplies defaults, no individual voice field can fail the\nimport. Defaults applied to a voice whose field is missing or invalid:\n\n- `wave`: `'square'`. Unknown wave strings fall back to a sine at playback\n  (see wave table below). Missing `wave` is fine.\n- `freq`: `220`. Applied if non-finite or `<= 0`. Noise/drum voices ignore it.\n- `volume`: `.04`. Applied if non-finite or `< 0`.\n- `pan`: `0` if non-finite.\n- `steps`, `stepProbs`, `stepAccents`, `stepDurs`, `melody`, `harmonics`,\n  `harmonicRatios`, `harmonicPhases`: coerced to `[]` if not arrays.\n  `harmonics` defaults to a single-fundamental `[1, 0, \u2026, 0]`;\n  `harmonicRatios` to `[1, 2, \u2026, 16]`; `harmonicPhases` to all zeros.\n  `steps` is auto-resized to `stepCount` at render/playback.\n- `midiNote`, `midiChannel`: `null` if non-finite.\n- `sampleBuffer`: stripped (can't arrive via JSON anyway).\n\n## Wave table\n\n- `sine square sawtooth triangle` \u2014 native oscillator types.\n- `pulse25 pulse12 pulse10 organ organ2 strings brass clarinet flute soft` \u2014\n  periodic-wave tables.\n- `custom` \u2014 built from `harmonics[16]`, `harmonicRatios[16]`, `harmonicPhases[16]`;\n  non-integer ratios produce an inharmonic partial bank.\n- `noise-white noise-pink` \u2014 looped noise buffer (`freq` ignored).\n- `drum-kick drum-snare drum-hat drum-cymbal drum-tom drum-clap drum-rim` \u2014\n  one-shot drum synth. Drum-shaping fields (`drumTone`, `drumToneEnd`,\n  `drumToneTime`, `drumNoise`, `drumNoiseFreq`, `drumNoiseQ`) fall back to\n  built-in drum presets when omitted.\n- `sample` \u2014 needs a decoded `sampleBuffer`, which cannot arrive via JSON. Do not use.\n- Unknown wave string: silently falls back to a default sine. No crash.\n\n## Oscillator \u2014 sequencer fields (all optional)\n\n- `steps`: gate array (`0` rest, nonzero hit). Auto-resized to `stepCount`.\n- `stepProbs`: per-step 0\u2013100 (default 100). `stepAccents`: per-step velocity\n  multiplier (default 1). `stepDurs`: per-step duration multiplier (default 1).\n- `stepLocks`: `{stepIndex: {filterFreq?, filterQ?, pan?, pitch?}}`, pitch in\n  semitones. `null`/`{}` = off.\n- `melody`: array of `{note, octave, vel?, prob?}` or `null`s, read at\n  `step % length`. `note` \u2208 sharps list. `vel` 0\u20131, `prob` 0\u2013100.\n- `melodyOctave`: default 3 (editor hint; playback uses each slot's `octave`).\n- `gateTime`: note length as fraction of step (default 1).\n- `rateMult`: polymeter multiplier (default 1).\n- `muted`: bool. `label`: string.\n- Kit voices: `stepData` = per-step `{on:0/1, vel:1, pitch:0, decay:1}`.\n  Auto-created when missing \u2014 omit it entirely.\n\n## Oscillator \u2014 sound fields (all optional, safe `||` fallbacks)\n\n- ADSR: `attack` .005, `decay` .1, `sustain` .8, `release` .15.\n- `pan` 0 (\u22121..1). `gainTrim` dB (\u221224..12).\n- Filter (`filterEnabled`): `filterType` lowpass|highpass|bandpass|notch|peaking,\n  `filterFreq` 800, `filterQ` 1.\n- Delay: `delayTime`, `delayFeedback`, `delayWet` (all 0 = off). `reverbSend` 0.\n- Chorus (`chorusEnabled`): `chorusType` chorus|flanger, `chorusRate` .8,\n  `chorusDepth` 15, `chorusFeedback` 0, `chorusWet` .5.\n- Distortion (`distEnabled`): `distType` soft|hard|foldback, `distDrive` 50, `distWet` 1.\n- Unison: `unisonCount` 1 (1\u20138), `unisonDetune` 20.\n- LFO: `lfoRate` .1, `lfoDepth` 2, `lfoTarget` pitch|volume|filter;\n  `lfo2Rate` .3, `lfo2Depth` 0, `lfo2Target` pitch|volume|filter|pan.\n- FM (`fmEnabled` and `fmDepth` > 0): `fmRatio` 2, `fmDepth` in Hz.\n- `glide`: portamento seconds (0 = off).\n\n## Import failure modes\n\n**Loud** (status shows `Error: \u2026`; prior patches kept, undo available):\ninvalid JSON; missing `patches`; `patches` lacking the selected key; a patch\nlacking an `oscillators` array; a file where every patch is dropped by\nnormalization (\"No valid patches in file\").\n**Silent**: everything else \u2014 unknown fields, keys, waves, scales, and any\nindividual voice field coerce to defaults. A patch is quietly skipped if its\n`oscillators` array is empty or contains no plain-object voices. Write minimal\npatches; the engine fills the rest.\n\n## Worked example (valid \u2014 imports and renders as-is)\n\n```json\n{\n  \"version\": 5,\n  \"patches\": {\n    \"init\": {\n      \"type\": \"synth\",\n      \"name\": \"Schema Demo\",\n      \"color\": \"#00ff00\",\n      \"oscillators\": [\n        {\n          \"wave\": \"sine\", \"freq\": 110, \"volume\": 0.05,\n          \"steps\": [1,0,0,0,1,0,0,0],\n          \"attack\": 0.01, \"decay\": 0.2, \"sustain\": 0.7, \"release\": 0.3\n        },\n        {\n          \"wave\": \"triangle\", \"freq\": 220, \"volume\": 0.03,\n          \"steps\": [1,1,1,1,1,1,1,1],\n          \"melody\": [\n            {\"note\": \"A\", \"octave\": 3},\n            {\"note\": \"C\", \"octave\": 4},\n            {\"note\": \"E\", \"octave\": 4},\n            {\"note\": \"G\", \"octave\": 3}\n          ],\n          \"reverbSend\": 0.5\n        }\n      ]\n    }\n  },\n  \"sequencer\": {\"bpm\": 60, \"stepCount\": 8, \"swing\": 0, \"stepValueKey\": \"e\"},\n  \"key\": {\"rootNote\": \"A\", \"scaleKey\": \"dorian\"},\n  \"master\": {\"volume\": 0.8, \"clipEnabled\": true, \"reverbSize\": 2.5, \"reverbDecay\": 3.5, \"reverbWetMaster\": 0.7}\n}\n```\n\nTwo voices: a gated A1 sine pulse and a triangle lead cycling Am7. Paste it,\npress Play.\n\n- `arpPool`: `'all'` (default) or `'bar'`. With `'bar'` the arp pool is only the gated melody notes in the\ncurrent bar (stepCount steps), so the arpeggio follows chord changes written into `melody`.\n- `sustain`: 0 is honoured (pluck/decay-only voices); previously it fell back to .8.\n\n## Resonator (per oscillator, optional)\n\n`\"resonance\": {\"enabled\": true, \"type\": \"string\"|\"bar\"|\"membrane\", \"damping\": 0.5, \"feedback\": 0.97, \"mix\": 0.5, \"trackPitch\": true}`\n\nA Karplus-Strong waveguide loop after the envelope, so it rings after note-off. `damping` 0..1 (higher = darker, shorter highs), `feedback` 0..0.995 (ring time, defined as per-period gain at 220 Hz and scaled with pitch so every note rings equally long), `mix` 0..1 (`dryWet` is accepted as an alias). Works on pitched waves and noise (noise + melody = plucks). Not applied to drum or sample voices. An AudioWorklet runs a true single-period loop at any pitch; if it can't load, a delay-loop fallback (n periods above ~345 Hz) is used.\n";
const CALORIS_SCHEMA_EXAMPLE="{\n  \"version\": 5,\n  \"patches\": {\n    \"init\": {\n      \"type\": \"synth\",\n      \"name\": \"Schema Demo\",\n      \"color\": \"#00ff00\",\n      \"oscillators\": [\n        {\n          \"wave\": \"sine\", \"freq\": 110, \"volume\": 0.05,\n          \"steps\": [1,0,0,0,1,0,0,0],\n          \"attack\": 0.01, \"decay\": 0.2, \"sustain\": 0.7, \"release\": 0.3\n        },\n        {\n          \"wave\": \"triangle\", \"freq\": 220, \"volume\": 0.03,\n          \"steps\": [1,1,1,1,1,1,1,1],\n          \"melody\": [\n            {\"note\": \"A\", \"octave\": 3},\n            {\"note\": \"C\", \"octave\": 4},\n            {\"note\": \"E\", \"octave\": 4},\n            {\"note\": \"G\", \"octave\": 3}\n          ],\n          \"reverbSend\": 0.5\n        }\n      ]\n    }\n  },\n  \"sequencer\": {\"bpm\": 60, \"stepCount\": 8, \"swing\": 0, \"stepValueKey\": \"e\"},\n  \"key\": {\"rootNote\": \"A\", \"scaleKey\": \"dorian\"},\n  \"master\": {\"volume\": 0.8, \"clipEnabled\": true, \"reverbSize\": 2.5, \"reverbDecay\": 3.5, \"reverbWetMaster\": 0.7}\n}";
function copyTextCompat(text,btn){
  const done=()=>{const old=btn.textContent;btn.textContent='\u2713 Copied';setTimeout(()=>{btn.textContent=old;},1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));}else{fallbackCopy(text,done);}
  function fallbackCopy(t,ok){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){setStatus('Copy failed: '+e.message);}document.body.removeChild(ta);}
}

// ══════════════════════════════════════════════════════════════
// AREA VOICES (v15.10) — “Which music plays in each place?”
// Assign CALORIS save slots to Distant Depths zones; export AREA_VOICE_DEFS-
// compatible JSON for DD’s mods menu (title screen → mods → import file).
// Assignments persist in localStorage under caloris_area_voices.
// ══════════════════════════════════════════════════════════════
const AREA_VOICE_ZONES=[
  ['station','Station'],
  ['ruins','Ruins'],
  ['forest','Forest'],
  ['anomaly','Anomaly'],
  ['settlement_tier2','Tier-2 settlement'],
  ['complex','Complex'],
  ['orbital','Orbital'],
  ['wasteland','Wasteland'],
  ['coast','Coast'],
  ['submerged','Submerged']
];
const AREA_VOICE_MOODS=['tense','calm','mysterious','dangerous','peaceful'];
const AV_LS_KEY='caloris_area_voices';
function avLoadState(){
  let s={};
  try{const raw=localStorage.getItem(AV_LS_KEY);if(raw)s=JSON.parse(raw)||{};}catch(e){s={};}
  AREA_VOICE_ZONES.forEach(function(z){s[z[0]]=s[z[0]]||{composition:'none',mood:'calm'};});
  return s;
}
function avSaveState(s){try{localStorage.setItem(AV_LS_KEY,JSON.stringify(s));}catch(e){}}
function avSlotOptions(){
  const out=[{id:'none',label:'(no music)'}];
  for(let i=0;i<4;i++){
    let nm='Slot '+(i+1);
    try{const raw=localStorage.getItem('caloris_slot_'+i);if(raw){const d=JSON.parse(raw);nm=d._slotName||nm;}}catch(e){}
    out.push({id:'slot_'+i,label:(i+1)+'. '+nm});
  }
  return out;
}
function avExportJSON(){
  const s=avLoadState(),out={};
  AREA_VOICE_ZONES.forEach(function(z){
    const e=s[z[0]]||{composition:'none',mood:'calm'};
    out[z[0]]={composition:e.composition,mood:e.mood};
  });
  return JSON.stringify(out,null,2);
}
function areaVoicesSection(){
  const sec=document.createElement('div');
  sec.id='areaVoicesPanel';
  sec.style.cssText='border:1px solid #4a4;padding:6px;border-radius:3px;margin-top:8px';
  const t=document.createElement('div');
  t.style.cssText='font-size:9px;color:#4a4;margin-bottom:2px;letter-spacing:.1em';
  t.textContent='AREA VOICES';
  sec.appendChild(t);
  const hint=document.createElement('div');
  hint.style.cssText='font-size:8px;color:#4a4;opacity:.7;margin-bottom:6px';
  hint.textContent='Which music plays in each place? Pick a saved composition for each Distant Depths zone. Export, then load it in DD: title screen \u2192 mods \u2192 import file.';
  sec.appendChild(hint);
  const state=avLoadState(),slotOpts=avSlotOptions();
  const grid=document.createElement('div');
  grid.style.cssText='display:flex;flex-direction:column;gap:5px';
  AREA_VOICE_ZONES.forEach(function(zpair){
    const zone=zpair[0],label=zpair[1];
    const cur=state[zone]||{composition:'none',mood:'calm'};
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:4px;align-items:center;flex-wrap:wrap';

    const comp=document.createElement('select');
    comp.setAttribute('aria-label','Music for '+label);
    comp.style.cssText='font-size:9px;flex:1 1 130px;min-width:130px;border:1px solid #4a43;color:#cfc;background:#001000;border-radius:2px;padding:2px;min-height:26px';
    slotOpts.forEach(function(o){
      const op=document.createElement('option');
      op.value=o.id;op.textContent=o.label;
      if(o.id===cur.composition)op.selected=true;
      comp.appendChild(op);
    });
    const mood=document.createElement('select');
    mood.setAttribute('aria-label','Mood for '+label);
    mood.style.cssText='font-size:9px;flex:0 0 auto;min-width:104px;border:1px solid #4a43;color:#cfc;background:#001000;border-radius:2px;padding:2px;min-height:26px';
    AREA_VOICE_MOODS.forEach(function(m){
      const op=document.createElement('option');
      op.value=m;op.textContent=m;
      if(m===cur.mood)op.selected=true;
      mood.appendChild(op);
    });
    const upd=function(){
      const s=avLoadState();
      s[zone]={composition:comp.value,mood:mood.value};
      avSaveState(s);
      renderPreview();
    };
    comp.addEventListener('change',upd);
    mood.addEventListener('change',upd);
    row.append(lab,comp,mood);
    grid.appendChild(row);
  });
  sec.appendChild(grid);
  const prev=document.createElement('textarea');
  prev.readOnly=true;prev.rows=6;
  prev.style.cssText='margin-top:6px;width:100%;box-sizing:border-box;font-size:8px;font-family:monospace;display:block;background:#001000;color:#8f8;border:1px solid #4a42;border-radius:3px;padding:4px';

  const btnRow=document.createElement('div');
  btnRow.style.cssText='display:flex;gap:4px;margin-top:4px';
  const copyBtn=document.createElement('button');
  copyBtn.textContent='\u25ba Copy JSON';
